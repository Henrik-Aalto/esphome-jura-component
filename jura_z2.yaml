substitutions:
  devicename: jura-coffee
  friendly_name: Jura Z2
  device_description: Kaffeemaschine · Küche
  jura_tx_pin: GPIO14
  jura_rx_pin: GPIO2

  # Befehle: modellabhängig. Bei Bedarf hier anpassen.
  cmd_power_on: "AN:01"
  cmd_power_off: "AN:02"      # aus ohne Spülen; FA:01 = aus inkl. Spülen
  cmd_rinse: "FA:02"          # Spülen
  cmd_milk_rinse: "FA:0C"     # Milchsystem spülen / Milchreinigung
  cmd_off_rinse: "FA:0E"      # Ausschaltspülung
  cmd_clean: "FA:0D"          # Reinigen
  cmd_descale: "FA:1F"        # Entkalken

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  comment: ${device_description}
  includes:
    - jura_z2.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          g_jura = new esphome::jura_z2::JuraZ2(id(uart_bus));
          g_jura->set_tray_sensor(id(tray_status));
          g_jura->set_tank_sensor(id(tank_status));
          g_jura->set_status_sensor(id(jura_status));
          g_jura->set_state_raw_sensor(id(jura_state_raw));
          g_jura->set_firmware_sensor(id(jura_firmware));
          g_jura->set_ic_bits_sensor(id(jura_ic_bits));
          g_jura->set_event_sensor(id(jura_last_event));
          g_jura->set_power_switch(id(jura_on_off_switch));
          g_jura->queue_firmware_read();

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .lan
  min_auth_mode: WPA2
  ap:
    ssid: "${friendly_name} Fallback AP"
    password: !secret fallback_ap_password

captive_portal:

logger:
  level: DEBUG

api:

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 2
  css_include: webui.css
  js_include: webui.js

uart:
  id: uart_bus
  tx_pin: ${jura_tx_pin}
  rx_pin: ${jura_rx_pin}
  baud_rate: 9600
  rx_buffer_size: 512

text_sensor:
  - platform: version
    name: "${friendly_name} ESPHome Version"

  - platform: template
    id: tray_status
    name: "Auffangschale"
    icon: "mdi:tray"
    update_interval: never

  - platform: template
    id: tank_status
    name: "Wassertank"
    icon: "mdi:water"
    update_interval: never

  - platform: template
    id: jura_status
    name: "Jura Status"
    icon: "mdi:information-outline"
    update_interval: never

  - platform: template
    id: jura_state_raw
    name: "Jura Rohzustand"
    icon: "mdi:code-json"
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: jura_firmware
    name: "Jura Firmware"
    icon: "mdi:chip"
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: jura_ic_bits
    name: "Jura IC-Bits"
    icon: "mdi:binary"
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: jura_last_event
    name: "Jura Ereignis"
    icon: "mdi:script-text-outline"
    entity_category: diagnostic
    update_interval: never

text:
  - platform: template
    name: "Jura Kommando"
    id: jura_command_text
    icon: "mdi:console"
    entity_category: diagnostic
    optimistic: true
    mode: text
    min_length: 0
    max_length: 32
    on_value:
      - lambda: |-
          if (g_jura != nullptr && !x.empty()) {
            g_jura->queue_command(x);
          }

binary_sensor:
  - platform: status
    name: "${friendly_name} Status"

switch:
  - platform: template
    name: "Kaffeeautomat"
    icon: "mdi:coffee-maker"
    id: jura_on_off_switch
    optimistic: false
    assumed_state: false
    turn_on_action:
      - lambda: |-
          if (g_jura != nullptr) {
            g_jura->set_powered(true);
            g_jura->queue_command("${cmd_power_on}");
          }
    turn_off_action:
      - lambda: |-
          if (g_jura != nullptr) {
            g_jura->set_powered(false);
            g_jura->queue_command("${cmd_power_off}");
          }

button:
  - platform: template
    name: "Spülen"
    icon: "mdi:water-sync"
    on_press:
      - lambda: |-
          if (g_jura != nullptr) g_jura->queue_command("${cmd_rinse}");

  - platform: template
    name: "Milchsystem spülen"
    icon: "mdi:cup-water"
    on_press:
      - lambda: |-
          if (g_jura != nullptr) g_jura->queue_command("${cmd_milk_rinse}");

  - platform: template
    name: "Ausschaltspülung"
    icon: "mdi:water-off"
    on_press:
      - lambda: |-
          if (g_jura != nullptr) g_jura->queue_command("${cmd_off_rinse}");

  - platform: template
    name: "Reinigen"
    icon: "mdi:auto-fix"
    on_press:
      - lambda: |-
          if (g_jura != nullptr) g_jura->queue_command("${cmd_clean}");

  - platform: template
    name: "Entkalken"
    icon: "mdi:water-boiler"
    on_press:
      - lambda: |-
          if (g_jura != nullptr) g_jura->queue_command("${cmd_descale}");

  - platform: template
    name: "Firmware lesen"
    icon: "mdi:chip"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (g_jura != nullptr) g_jura->queue_firmware_read();

interval:
  - interval: 10ms
    then:
      - lambda: |-
          if (g_jura != nullptr) g_jura->loop();

  - interval: 2s
    then:
      - lambda: |-
          if (g_jura != nullptr) g_jura->poll();
