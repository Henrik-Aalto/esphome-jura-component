substitutions:
  devicename: jura-coffee
  friendly_name: Jura Z2
  device_description: Kaffeemaschine · Küche
  jura_tx_pin: GPIO14
  jura_rx_pin: GPIO2

  # Befehle: modellabhängig. Bei Bedarf hier anpassen.
  cmd_power_on: "AN:01"
  cmd_power_off: "AN:02"    # aus ohne Spülen; FA:01 = aus inkl. Spülen
  cmd_rinse: "FA:02"        # Spülen / Wartung (manuell)
  cmd_espresso: "FA:04"
  cmd_coffee: "FA:05"
  cmd_hot_water: "FA:06"
  cmd_milk_foam: "FA:07"
  cmd_latte: "FA:08"

esphome:
  name: ${devicename}
  friendly_name: ${friendly_name}
  comment: ${device_description}
  includes:
    - jura_z2.h
  on_boot:
    priority: -100
    then:
      - lambda: |-
          g_jura = new esphome::jura_z2::JuraZ2(id(uart_bus));
          g_jura->set_espresso(id(num_single_espresso));
          g_jura->set_double_espresso(id(num_double_espresso));
          g_jura->set_coffee(id(num_coffee));
          g_jura->set_double_coffee(id(num_double_coffee));
          g_jura->set_cappuccino(id(num_cappuccino));
          g_jura->set_latte(id(num_latte));
          g_jura->set_double_ristretto(id(num_double_ristretto));
          g_jura->set_brew_cycles(id(num_brew_cycles));
          g_jura->set_clean(id(num_clean));
          g_jura->set_descale(id(num_descale));
          g_jura->set_grounds(id(num_grounds));
          g_jura->set_tray_sensor(id(tray_status));
          g_jura->set_tank_sensor(id(tank_status));
          g_jura->set_status_sensor(id(jura_status));
          g_jura->set_firmware_sensor(id(jura_firmware));
          g_jura->set_ic_bits_sensor(id(jura_ic_bits));
          g_jura->set_hz_sensor(id(jura_hz));
          g_jura->set_cs_sensor(id(jura_cs));
          g_jura->set_counter_changes_sensor(id(jura_counter_changes));
          g_jura->set_event_sensor(id(jura_last_event));
          g_jura->set_power_switch(id(jura_on_off_switch));
          g_jura->queue_firmware_read();

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: .lan
  min_auth_mode: WPA2
  ap:
    ssid: "${friendly_name} Fallback AP"
    password: !secret fallback_ap_password

captive_portal:

logger:
  level: DEBUG

api:

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 2
  css_include: webui.css
  js_include: webui.js

uart:
  id: uart_bus
  tx_pin: ${jura_tx_pin}
  rx_pin: ${jura_rx_pin}
  baud_rate: 9600
  rx_buffer_size: 512

sensor:
  - platform: uptime
    name: "${friendly_name} Uptime"

  - platform: wifi_signal
    name: "${friendly_name} WiFi Signal"
    update_interval: 60s

  - platform: template
    id: num_single_espresso
    name: "Espressos gesamt"
    icon: "mdi:counter"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: num_double_espresso
    name: "Doppelte Espressos / Ristretto"
    icon: "mdi:counter"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: num_coffee
    name: "Kaffees gesamt"
    icon: "mdi:counter"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: num_double_coffee
    name: "Doppelte Kaffees / Flat White"
    icon: "mdi:counter"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: num_cappuccino
    name: "Cappuccini / Ristretto"
    icon: "mdi:counter"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: num_latte
    name: "Latte Macchiati / Cappuccini"
    icon: "mdi:counter"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: num_double_ristretto
    name: "Doppelte Ristretti"
    icon: "mdi:counter"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: num_brew_cycles
    name: "Brühgruppen-/Spülzyklen"
    icon: "mdi:counter"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: num_clean
    name: "Reinigungen gesamt"
    icon: "mdi:counter"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: num_descale
    name: "Entkalkungen gesamt"
    icon: "mdi:counter"
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: num_grounds
    name: "Kaffeesatz-Füllstand"
    icon: "mdi:counter"
    accuracy_decimals: 0
    update_interval: never

text_sensor:
  - platform: version
    name: "${friendly_name} ESPHome Version"

  - platform: template
    id: tray_status
    name: "Auffangschale"
    icon: "mdi:tray"
    update_interval: never

  - platform: template
    id: tank_status
    name: "Wassertank"
    icon: "mdi:water"
    update_interval: never

  - platform: template
    id: jura_status
    name: "Jura Status"
    icon: "mdi:information-outline"
    update_interval: never

  - platform: template
    id: jura_firmware
    name: "Jura Firmware/Modell"
    icon: "mdi:chip"
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: jura_ic_bits
    name: "Jura IC-Bits"
    icon: "mdi:binary"
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: jura_hz
    name: "Jura HZ-Status"
    icon: "mdi:code-json"
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: jura_cs
    name: "Jura CS-Status"
    icon: "mdi:code-json"
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: jura_counter_changes
    name: "Jura Zähleränderung"
    icon: "mdi:counter"
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: jura_last_event
    name: "Jura Ereignis"
    icon: "mdi:script-text-outline"
    entity_category: diagnostic
    update_interval: never

text:
  - platform: template
    name: "Jura Kommando"
    id: jura_command_text
    icon: "mdi:console"
    entity_category: diagnostic
    optimistic: true
    mode: text
    min_length: 0
    max_length: 32
    on_value:
      - lambda: |-
          if (g_jura != nullptr && !x.empty()) {
            g_jura->queue_command(x);
          }

binary_sensor:
  - platform: status
    name: "${friendly_name} Status"

switch:
  - platform: template
    name: "Kaffeeautomat"
    icon: "mdi:coffee-maker"
    id: jura_on_off_switch
    optimistic: true
    assumed_state: false
    turn_on_action:
      - lambda: |-
          if (g_jura != nullptr) {
            g_jura->set_powered(true);
            g_jura->queue_command("${cmd_power_on}");
          }
    turn_off_action:
      - lambda: |-
          if (g_jura != nullptr) {
            g_jura->set_powered(false);
            g_jura->queue_command("${cmd_power_off}");
          }

button:
  - platform: template
    name: "Spülen"
    icon: "mdi:water-sync"
    on_press:
      - lambda: |-
          if (g_jura != nullptr) g_jura->queue_command("${cmd_rinse}");

  - platform: template
    name: "Espresso"
    icon: "mdi:coffee"
    on_press:
      - lambda: |-
          if (g_jura != nullptr) g_jura->queue_command("${cmd_espresso}");

  - platform: template
    name: "Kaffee"
    icon: "mdi:coffee-maker"
    on_press:
      - lambda: |-
          if (g_jura != nullptr) g_jura->queue_command("${cmd_coffee}");

  - platform: template
    name: "Heißwasser"
    icon: "mdi:water-boiler"
    on_press:
      - lambda: |-
          if (g_jura != nullptr) g_jura->queue_command("${cmd_hot_water}");

  - platform: template
    name: "Milchschaum"
    icon: "mdi:cup"
    on_press:
      - lambda: |-
          if (g_jura != nullptr) g_jura->queue_command("${cmd_milk_foam}");

  - platform: template
    name: "Latte Macchiato"
    icon: "mdi:coffee-outline"
    on_press:
      - lambda: |-
          if (g_jura != nullptr) g_jura->queue_command("${cmd_latte}");

  - platform: template
    name: "Firmware/Modell lesen"
    icon: "mdi:chip"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          if (g_jura != nullptr) g_jura->queue_firmware_read();

interval:
  - interval: 10ms
    then:
      - lambda: |-
          if (g_jura != nullptr) g_jura->loop();

  - interval: 10s
    then:
      - lambda: |-
          if (g_jura != nullptr) g_jura->poll();

  - interval: 60s
    then:
      - lambda: |-
          if (g_jura != nullptr) {
            g_jura->queue_command("HZ:");
            g_jura->queue_command("CS:");
          }
